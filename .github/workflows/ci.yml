name: CI

# Supply-chain rule: every `uses:` is pinned to a commit SHA (the release
# job holds write access, CI must not execute a moved tag). Bump = replace
# the SHA and the version comment together, in BOTH workflows.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cmake
        run: python3 -m pip install --user cmake

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/_deps
            build/llama-ext
            build/llama-install
            build/downloads
          key: linux-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Hygiene checks
        run: sh scripts/check_hygiene.sh

      - name: Licence checks
        run: sh scripts/check_licenses.sh

      - name: Configure (phase 1)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (phase 1, builds llama)
        run: cmake --build build -j4

      - name: Configure (phase 2)
        run: cmake -S . -B build

      - name: Build (phase 2)
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-ubuntu-24:
    # Ubuntu port L0: pinned 24.04 runner, noble dep install (the canonical
    # list lives in scripts/install_ubuntu_deps.sh + docs/UBUNTU_DEPS.md -
    # an unknown package name fails this job, which is the R5 check),
    # portable build, ctest and an Xvfb smoke run. The smoke target is the
    # current stub binary; it becomes the real GUI smoke at L4.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cmake (repo CI pattern, parity with the linux job)
        run: python3 -m pip install --user cmake

      - name: "Install desktop deps (canonical list: docs/UBUNTU_DEPS.md)"
        run: sudo sh scripts/install_ubuntu_deps.sh

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/_deps
          key: linux24-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (portable core; LWF_BUILD_FULL stays off on Linux)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: GUI smoke under Xvfb (stub app until L4)
        run: |
          set -euo pipefail
          xvfb-run -a ./build/EchoFlow | tee /tmp/lwf-smoke.out
          grep -q "Echo flow core build" /tmp/lwf-smoke.out
          echo "smoke: app binary links, runs with a display, banner OK"

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/_deps
            build/llama-ext
            build/llama-install
            build/downloads
            _deps-cache
          key: windows-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'scripts/fetch_deps.ps1') }}

      - name: Fetch dependencies (tarballs + grpc submodules at pinned SHAs)
        run: pwsh scripts/fetch_deps.ps1

      - name: Configure (phase 1)
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DGRPC_URL=file://$ws/_deps-cache/grpc-v1.71.0-full.tar.gz" "-DLLAMA_URL=file://$ws/_deps-cache/llama-b10603.tar.gz"

      - name: Build (phase 1, builds llama)
        # Phase 1 exists to build+install llama only: with no llama-install
        # present, LLAMA_READY is false, the `llama` target is a placeholder
        # without the ggml link closure (llama b10603 objects reference
        # ggml_rope_set_offset, absent from whisper v1.9.3's bundled ggml),
        # so linking the app here is impossible by design. Build the
        # llama_ext ExternalProject explicitly; phase 2 re-configures with
        # find_package(llama) and the full build then links against the
        # installed closure. (Linux: LWF_BUILD_FULL is off so llama_ext does
        # not exist there; the project builds core-only and links fine cold.)
        run: cmake --build build --config Release --target llama_ext -j 4

      - name: Configure (phase 2)
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DGRPC_URL=file://$ws/_deps-cache/grpc-v1.71.0-full.tar.gz" "-DLLAMA_URL=file://$ws/_deps-cache/llama-b10603.tar.gz"

      - name: Build (phase 2)
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
