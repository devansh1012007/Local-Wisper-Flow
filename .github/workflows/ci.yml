name: ci

# Linux port CI (plan 2026-11-21, change C10). The Windows full job lives in
# this file in the operator's repository; when merging this branch, keep the
# existing windows jobs and add the linux-ubuntu-24 job below to the same
# workflow (do not replace them).

on:
  push:
  pull_request:

jobs:
  linux-ubuntu-24:
    name: ubuntu-24.04 (core + linux port)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install platform dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxtst-dev libxi-dev libncurses-dev libnotify-bin

      - name: Configure (core build, platform layer on)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4 2>&1 | tee build.log

      - name: Check for warnings (G1)
        run: |
          if grep -iE "warning:" build.log | grep -v "_deps" | grep -vi "deprecat"; then
            echo "::error::new warnings in the build"
            exit 1
          fi

      - name: Test (G2)
        run: ctest --test-dir build --output-on-failure

      - name: Hygiene gate (G4)
        run: sh scripts/check_hygiene.sh

      - name: Privacy gate (no-network)
        run: sh scripts/check_no_network.sh

      - name: Smoke (L0 banner contract)
        run: |
          out=$(./build/local-wisper-flow --smoke)
          echo "$out"
          case "$out" in
            *"Local Wisper Flow core build:"*) echo "smoke: OK" ;;
            *) echo "::error::smoke banner missing"; exit 1 ;;
          esac

      - name: Daemon headless smoke (start, SIGHUP, SIGTERM)
        env:
          LWF_HOME: /tmp/lwf-ci-home
        run: |
          ./build/local-wisper-flow --daemon &
          pid=$!
          sleep 2
          kill -0 $pid
          grep -q "daemon ready" "$LWF_HOME/logs/lwf.log"
          kill -HUP $pid
          sleep 1
          grep -q "config reloaded" "$LWF_HOME/logs/lwf.log"
          kill -TERM $pid
          wait $pid
          echo "daemon headless smoke: OK"

      - name: Configure full build (whisper/llama/miniaudio/grpc fetch)
        run: cmake -S . -B build-full -DCMAKE_BUILD_TYPE=Release -DLWF_BUILD_FULL=ON

      - name: Build full (providers)
        run: cmake --build build-full -j4

      - name: Test full
        run: ctest --test-dir build-full --output-on-failure
