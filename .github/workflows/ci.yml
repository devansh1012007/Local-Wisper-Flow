name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake
        run: python3 -m pip install --user cmake

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/llama-ext
            build/llama-install
            build/downloads
          key: linux-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Hygiene checks
        run: sh scripts/check_hygiene.sh

      - name: Configure (phase 1)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (phase 1, builds llama)
        run: cmake --build build -j4

      - name: Configure (phase 2)
        run: cmake -S . -B build

      - name: Build (phase 2)
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/llama-ext
            build/llama-install
            build/downloads
            _deps-cache
          key: windows-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'scripts/fetch_deps.ps1') }}

      - name: Fetch dependencies (tarballs + grpc submodules at pinned SHAs)
        run: pwsh scripts/fetch_deps.ps1

      - name: Configure (phase 1)
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DGRPC_URL=file:///$ws/_deps-cache/grpc-v1.71.0-full.tar.gz" "-DLLAMA_URL=file:///$ws/_deps-cache/llama-b10603.tar.gz"

      - name: Build (phase 1, builds llama)
        run: cmake --build build --config Release -j 4

      - name: Configure (phase 2)
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DGRPC_URL=file:///$ws/_deps-cache/grpc-v1.71.0-full.tar.gz" "-DLLAMA_URL=file:///$ws/_deps-cache/llama-b10603.tar.gz"

      - name: Build (phase 2)
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
